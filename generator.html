<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Hitster Generator V1.0-alpha</title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f7;
}

header{
    background:#0A84FF;
    color:white;
    padding:18px;
    font-size:34px;
    font-weight:bold;
}

header div{
    font-size:18px;
    font-weight:normal;
    margin-top:6px;
}

main{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.box{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    width:100%;
    padding:18px;
    font-size:24px;
    border:none;
    border-radius:14px;
    background:#e8e8ed;
    cursor:pointer;
}

button:hover{
    background:#dcdce1;
}

.scroll{
    overflow:auto;
    max-height:500px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:18px;
}

th{
    background:#efefef;
    position:sticky;
    top:0;
}

th,td{
    border:1px solid #cccccc;
    padding:8px;
    text-align:left;
    vertical-align:top;
}

input[type=text]{
    width:100%;
    padding:14px;
    font-size:22px;
    border:1px solid #cccccc;
    border-radius:10px;
    box-sizing:border-box;
}

canvas{
    display:block;
    margin:auto;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<header>
    🎵 HH Musikquiz

    <div style="font-size:18px;font-weight:normal;margin-top:8px;">
        Version 6
    </div>
</header>

<main>

<div class="box">
    <input id="csv" type="file" accept=".csv" hidden>

    <button onclick="csv.click()">
        📂 CSV-Datei auswählen
    </button>
</div>

<div class="box">

    <b>Datei:</b>
    <span id="file">Keine</span>

    <br><br>

    <b>Status:</b>
    <span id="status">Bereit.</span>

    <br><br>

    <b>Karten:</b>
    <span id="cards">0</span>

    <br>

    <b>Fehlende IDs:</b>
    <span id="missing">0</span>

    <br>

    <b>Fehler:</b>
    <span id="errors">0</span>

</div>

<div class="box">

    <input
        id="search"
        type="text"
        placeholder="🔍 Film, Interpret oder Titel suchen..."
        style="width:100%; padding:12px; font-size:18px; box-sizing:border-box;"
    >

</div>

<div class="box scroll">
    <table id="tbl"></table>
</div>

<div class="box">
    <button id="downloadQr" disabled>
        QR-Codes als Bild speichern
    </button>
</div>

</main>

<script>
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

const csvInput = document.getElementById("csv");
const fileName = document.getElementById("file");
const statusText = document.getElementById("status");
const cardsCount = document.getElementById("cards");
const missingCount = document.getElementById("missing");
const errorsCount = document.getElementById("errors");
const table = document.getElementById("tbl");
const searchInput = document.getElementById("search");
const downloadQrButton = document.getElementById("downloadQr");

let data = [];

function createId(existingIds) {
    let newId;

    do {
        const values = new Uint32Array(6);
        crypto.getRandomValues(values);

        newId = "FILM-";

        for (let i = 0; i < 6; i++) {
            newId += ALPHABET[values[i] % ALPHABET.length];
        }
    } while (existingIds.has(newId));

    existingIds.add(newId);
    return newId;
}

function createQrCode(canvas, qrData) {
    new QRious({
        element: canvas,
        value: JSON.stringify(qrData),
        size: 100,
        level: "M",
        padding: 4
    });

    return Promise.resolve();
}

async function showTable(rows) {
    table.innerHTML = "";

    const columns = Object.keys(rows[0] || {});
    columns.push("QR");

    const headerRow = document.createElement("tr");

    columns.forEach(column => {
        const th = document.createElement("th");
        th.textContent = column;
        headerRow.appendChild(th);
    });

    table.appendChild(headerRow);

    for (const row of rows) {
        const tableRow = document.createElement("tr");

        for (const column of columns) {
            const td = document.createElement("td");

            if (column === "QR") {
                const canvas = document.createElement("canvas");

                const qrData = {
                    v: 1,
                    id: row.ID || "",
                    artist: row.Interpret || "",
                    title: row.Titel || "",
                    version: row.Version || "",
                    year: row.Jahr || ""
                };

                try {
                    await createQrCode(canvas, qrData);
                    td.appendChild(canvas);
                } catch (error) {
                    td.textContent = "QR-Fehler";
                    console.error(error);
                }
            } else {
                td.textContent = row[column] || "";
            }

            tableRow.appendChild(td);
        }

        table.appendChild(tableRow);
    }
    
    downloadQrButton.disabled = rows.length === 0;
}

function downloadAllQrCodes() {
    const qrCanvases = table.querySelectorAll("canvas");

    if (!qrCanvases.length) {
        statusText.textContent =
            "Keine QR-Codes zum Speichern vorhanden.";
        return;
    }

    const columns = 2;
    const cardWidth = 420;
    const cardHeight = 180;
    const rows = Math.ceil(data.length / columns);

    const exportCanvas = document.createElement("canvas");

    exportCanvas.width = columns * cardWidth;
    exportCanvas.height = rows * cardHeight;

    const context = exportCanvas.getContext("2d");

    context.fillStyle = "#ffffff";
    context.fillRect(
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
    );

    context.fillStyle = "#000000";
    context.font = "22px Arial";
    context.textBaseline = "top";

    data.forEach((card, index) => {
        const column = index % columns;
        const row = Math.floor(index / columns);

        const x = column * cardWidth;
        const y = row * cardHeight;

        context.strokeStyle = "#cccccc";
        context.strokeRect(
            x + 10,
            y + 10,
            cardWidth - 20,
            cardHeight - 20
        );

        context.drawImage(
            qrCanvases[index],
            x + 25,
            y + 25,
            120,
            120
        );

        context.fillText(
            card.ID || "",
            x + 165,
            y + 30
        );

        context.fillText(
            card.Film || "",
            x + 165,
            y + 65
        );

        context.fillText(
            card.Interpret || "",
            x + 165,
            y + 100
        );

        context.fillText(
            card.Titel || "",
            x + 165,
            y + 135
        );
    });

    const imageData = exportCanvas.toDataURL("image/png");

    statusText.textContent =
        "Bild geöffnet. Danach Teilen → In Dateien sichern.";

    window.location.href = imageData;
}

csvInput.addEventListener("change", () => {
    if (!csvInput.files.length) {
        return;
    }

    if (typeof Papa === "undefined") {
        statusText.textContent = "Fehler: CSV-Bibliothek fehlt.";
        return;
    }

    if (typeof QRious === "undefined") {
    statusText.textContent = "Fehler: QR-Code-Bibliothek fehlt.";
    return;
}

    const selectedFile = csvInput.files[0];
    fileName.textContent = selectedFile.name;
    statusText.textContent = "CSV wird eingelesen …";

    const reader = new FileReader();

    reader.onload = async () => {
        const result = Papa.parse(reader.result, {
            header: true,
            skipEmptyLines: true,
            transformHeader: header => header.trim()
        });

        if (result.errors.length > 0) {
            console.error(result.errors);
        }

        data = result.data;

        let missingIds = 0;
        let validationErrors = 0;

        const existingIds = new Set();

        data.forEach(row => {
            if (row.ID && row.ID.trim()) {
                const currentId = row.ID.trim();

                if (existingIds.has(currentId)) {
                    validationErrors++;
                    row.ID = createId(existingIds);
                    missingIds++;
                } else {
                    row.ID = currentId;
                    existingIds.add(currentId);
                }
            } else {
                row.ID = createId(existingIds);
                missingIds++;
            }

            if (!String(row.Film || "").trim()) {
                validationErrors++;
            }

            if (!String(row.Interpret || "").trim()) {
                validationErrors++;
            }

            if (!String(row.Titel || "").trim()) {
                validationErrors++;
            }

            if (!/^[0-9]{4}$/.test(String(row.Jahr || "").trim())) {
                validationErrors++;
            }
        });

        cardsCount.textContent = data.length;
        missingCount.textContent = missingIds;
        errorsCount.textContent =
            validationErrors + result.errors.length;

        statusText.textContent = "QR-Codes werden erzeugt …";

        await showTable(data);

        statusText.textContent = "CSV und QR-Codes erfolgreich erzeugt.";
    };

    reader.onerror = () => {
        statusText.textContent = "Fehler beim Lesen der CSV-Datei.";
    };

    reader.readAsText(selectedFile, "UTF-8");
});

if (searchInput) {
    searchInput.addEventListener("input", () => {
        const searchTerm = searchInput.value
            .trim()
            .toLowerCase();

        const rows = table.getElementsByTagName("tr");

        for (let i = 1; i < rows.length; i++) {
            const rowText = rows[i].innerText.toLowerCase();

            rows[i].style.display =
                rowText.includes(searchTerm) ? "" : "none";
        }
    });
}

downloadQrButton.addEventListener(
    "click",
    downloadAllQrCodes
);

</script>

</body></html>
