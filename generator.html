<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hitster Generator V1.0-alpha</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f7}header{background:#0A84FF;color:#fff;padding:16px;font-size:26px}
main{max-width:1000px;margin:auto;padding:16px}.box{background:#fff;padding:16px;border-radius:12px;margin-bottom:16px}
button{width:100%;padding:16px;font-size:20px}.scroll{overflow:auto;max-height:420px}table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px}th{background:#eee}
</style></head><body>
<header>🎵 Hitster Kartengenerator V1.0-alpha</header>
<main>
<div class="box"><input id="csv" type="file" accept=".csv" hidden><button onclick="csv.click()">📂 CSV-Datei auswählen</button></div>
<div class="box"><b>Datei:</b> <span id="file">Keine</span><br><br><b>Status:</b> <span id="status">Bereit.</span><br><br><b>Karten:</b> <span id="cards">0</span> | <b>Fehlende IDs:</b> <span id="missing">0</span></div>
<div class="box scroll"><table id="tbl"></table></div>
</main>
<script>
const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function id(){let s="FILM-";for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
csv.onchange=()=>{if(!csv.files.length)return;file.textContent=csv.files[0].name;let r=new FileReader();
r.onload=()=>{let x=Papa.parse(r.result,{header:true,skipEmptyLines:true});let d=x.data;cards.textContent=d.length;let m=0;
d.forEach(e=>{if(!e.ID){e.ID=id();m++;}});missing.textContent=m;status.textContent="CSV eingelesen";
let h=Object.keys(d[0]||{});tbl.innerHTML="";let tr=document.createElement("tr");
h.forEach(c=>{let th=document.createElement("th");th.textContent=c;tr.appendChild(th)});tbl.appendChild(tr);
d.forEach(r=>{let tr=document.createElement("tr");h.forEach(c=>{let td=document.createElement("td");td.textContent=r[c]||"";tr.appendChild(td)});tbl.appendChild(tr);});};
r.readAsText(csv.files[0],"UTF-8");}
</script></body></html>
