<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Hitster Generator V1.0-alpha</title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f7;
}

header{
    background:#0A84FF;
    color:white;
    padding:18px;
    font-size:34px;
    font-weight:bold;
}

header div{
    font-size:18px;
    font-weight:normal;
    margin-top:6px;
}

main{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.box{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    width:100%;
    padding:18px;
    font-size:24px;
    border:none;
    border-radius:14px;
    background:#e8e8ed;
    cursor:pointer;
}

button:hover{
    background:#dcdce1;
}

.scroll{
    overflow:auto;
    max-height:500px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:18px;
}

th{
    background:#efefef;
    position:sticky;
    top:0;
}

th,td{
    border:1px solid #cccccc;
    padding:8px;
    text-align:left;
    vertical-align:top;
}

input[type=text]{
    width:100%;
    padding:14px;
    font-size:22px;
    border:1px solid #cccccc;
    border-radius:10px;
    box-sizing:border-box;
}

canvas{
    display:block;
    margin:auto;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<header>
    🎵 HH Musikquiz

    <div style="font-size:18px;font-weight:normal;margin-top:8px;">
        Version 15
    </div>
</header>

<main>

<div class="box">
    <input id="csv" type="file" accept=".csv" hidden>

    <button onclick="csv.click()">
        📂 CSV-Datei auswählen
    </button>
</div>

<div class="box">

    <b>Datei:</b>
    <span id="file">Keine</span>

    <br><br>

    <b>Status:</b>
    <span id="status">Bereit.</span>

    <br><br>

    <b>Karten:</b>
    <span id="cards">0</span>

    <br>

    <b>Fehlende IDs:</b>
    <span id="missing">0</span>

    <br>

    <b>Fehler:</b>
    <span id="errors">0</span>

</div>

<div class="box">

    <input
        id="search"
        type="text"
        placeholder="🔍 Film, Interpret oder Titel suchen..."
        style="width:100%; padding:12px; font-size:18px; box-sizing:border-box;"
    >

</div>

<div class="box scroll">
    <table id="tbl"></table>
</div>

<div class="box">
    <label for="duplexMode">Duplexdruck:</label>

<select id="duplexMode">
    <option value="long">Lange Kante wenden</option>
    <option value="short">Kurze Kante wenden</option>
</select>

<button id="downloadQr" type="button">
    Duplex-PDF erstellen
</button>

</div>

</main>

<script>
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

const csvInput = document.getElementById("csv");
const fileName = document.getElementById("file");
const statusText = document.getElementById("status");
const cardsCount = document.getElementById("cards");
const missingCount = document.getElementById("missing");
const errorsCount = document.getElementById("errors");
const table = document.getElementById("tbl");
const searchInput = document.getElementById("search");
const downloadQrButton = document.getElementById("downloadQr");

let data = [];

function createId(existingIds) {
    let newId;

    do {
        const values = new Uint32Array(6);
        crypto.getRandomValues(values);

        newId = "FILM-";

        for (let i = 0; i < 6; i++) {
            newId += ALPHABET[values[i] % ALPHABET.length];
        }
    } while (existingIds.has(newId));

    existingIds.add(newId);
    return newId;
}

function createQrCode(canvas, qrData) {
    new QRious({
        element: canvas,
        value: JSON.stringify(qrData),
        size: 100,
        level: "M",
        padding: 4
    });

    return Promise.resolve();
}

async function showTable(rows) {
    table.innerHTML = "";

    const columns = Object.keys(rows[0] || {});
    columns.push("QR");

    const headerRow = document.createElement("tr");

    columns.forEach(column => {
        const th = document.createElement("th");
        th.textContent = column;
        headerRow.appendChild(th);
    });

    table.appendChild(headerRow);

    for (const row of rows) {
        const tableRow = document.createElement("tr");

        for (const column of columns) {
            const td = document.createElement("td");

            if (column === "QR") {
                const canvas = document.createElement("canvas");

                const qrData = {
                    v: 1,
                    id: row.ID || "",
                    artist: row.Interpret || "",
                    title: row.Titel || "",
                    version: row.Version || "",
                    year: row.Jahr || ""
                };

                try {
                    await createQrCode(canvas, qrData);
                    td.appendChild(canvas);
                } catch (error) {
                    td.textContent = "QR-Fehler";
                    console.error(error);
                }
            } else {
                td.textContent = row[column] || "";
            }

            tableRow.appendChild(td);
        }

        table.appendChild(tableRow);
    }
    
    downloadQrButton.disabled = rows.length === 0;
}

function downloadAllQrCodes() {
    const { jsPDF } = window.jspdf;

    const qrCanvases = Array.from(
        table.querySelectorAll("canvas")
    );

    if (!qrCanvases.length) {
        statusText.textContent =
            "Keine QR-Codes zum Drucken vorhanden.";
        return;
    }

    const duplexMode =
        document.getElementById("duplexMode").value;

    const pdf = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4"
    });

    const pageWidth = 210;
    const pageHeight = 297;

    const columns = 3;
    const rows = 4;
    const cardsPerSheet = columns * rows;

    const marginLeft = 9;
    const marginTop = 12;

    const cardWidth = 64;
    const cardHeight = 66;

    const contentWidth = columns * cardWidth;
    const contentHeight = rows * cardHeight;

    const sheetCount =
        Math.ceil(data.length / cardsPerSheet);

    function getCardPosition(index, isBack) {
        const position = index % cardsPerSheet;

        let column = position % columns;
        let row = Math.floor(position / columns);

        if (isBack && duplexMode === "long") {
            column = columns - 1 - column;
        }

        if (isBack && duplexMode === "short") {
            row = rows - 1 - row;
        }

        return {
            x: marginLeft + column * cardWidth,
            y: marginTop + row * cardHeight
        };
    }

    function drawCutMarks() {
        pdf.setDrawColor(0);
        pdf.setLineWidth(0.15);

        const markLength = 3;

        for (let column = 0; column <= columns; column++) {
            const x = marginLeft + column * cardWidth;

            pdf.line(
                x,
                marginTop - markLength,
                x,
                marginTop
            );

            pdf.line(
                x,
                marginTop + contentHeight,
                x,
                marginTop + contentHeight + markLength
            );
        }

        for (let row = 0; row <= rows; row++) {
            const y = marginTop + row * cardHeight;

            pdf.line(
                marginLeft - markLength,
                y,
                marginLeft,
                y
            );

            pdf.line(
                marginLeft + contentWidth,
                y,
                marginLeft + contentWidth + markLength,
                y
            );
        }
    }

    function addFooter(pageNumber, totalPages, side) {
        pdf.setFontSize(7);

        pdf.text(
            `HH Musikquiz – Version 14 – ${side}`,
            10,
            pageHeight - 5
        );

        pdf.text(
            `Seite ${pageNumber}/${totalPages}`,
            pageWidth - 10,
            pageHeight - 5,
            { align: "right" }
        );
    }

    function addWrappedText(text, x, y, width, fontSize) {
        if (!text) {
            return y;
        }

        pdf.setFontSize(fontSize);

        const lines = pdf.splitTextToSize(
            String(text),
            width
        );

        pdf.text(lines, x, y);

        return y + lines.length * (fontSize * 0.38);
    }

    const totalPages = sheetCount * 2;
    let currentPage = 0;

    for (
        let sheetIndex = 0;
        sheetIndex < sheetCount;
        sheetIndex++
    ) {
        if (currentPage > 0) {
            pdf.addPage();
        }

        currentPage++;

        drawCutMarks();

        const startIndex =
            sheetIndex * cardsPerSheet;

        const endIndex = Math.min(
            startIndex + cardsPerSheet,
            data.length
        );

        for (
            let cardIndex = startIndex;
            cardIndex < endIndex;
            cardIndex++
        ) {
            const card = data[cardIndex];

            const position =
                getCardPosition(cardIndex, false);

            const qrImage =
                qrCanvases[cardIndex].toDataURL(
                    "image/png"
                );

            const qrSize = 43;

            const qrX =
                position.x +
                (cardWidth - qrSize) / 2;

            const qrY = position.y + 7;

            pdf.addImage(
                qrImage,
                "PNG",
                qrX,
                qrY,
                qrSize,
                qrSize
            );

            pdf.setFontSize(8);

            pdf.text(
                String(card.ID || ""),
                position.x + cardWidth / 2,
                position.y + 56,
                { align: "center" }
            );
        }

        addFooter(
            currentPage,
            totalPages,
            "Vorderseiten"
        );

        pdf.addPage();
        currentPage++;

        drawCutMarks();

        for (
            let cardIndex = startIndex;
            cardIndex < endIndex;
            cardIndex++
        ) {
            const card = data[cardIndex];

            const position =
                getCardPosition(cardIndex, true);

                const centerX =
    position.x + cardWidth / 2;

const textWidth =
    cardWidth - 10;

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.setFontSize(10);

const filmLines =
    pdf.splitTextToSize(
        String(card.Film || ""),
        textWidth
    );

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.setFontSize(8);

const interpretLines =
    pdf.splitTextToSize(
        String(card.Interpret || ""),
        textWidth
    );

const titleLines =
    pdf.splitTextToSize(
        String(card.Titel || ""),
        textWidth
    );

const versionLines =
    pdf.splitTextToSize(
        String(card.Version || ""),
        textWidth
    );

pdf.setFontSize(7);

const infoLines =
    pdf.splitTextToSize(
        String(card.Info || ""),
        textWidth
    );

const filmHeight =
    filmLines.length * 4.2;

const interpretHeight =
    interpretLines.length * 3.2;

const titleHeight =
    titleLines.length * 3.2;

const versionHeight =
    versionLines.length * 3.2;

const yearHeight = 9;

const infoHeight =
    infoLines.length * 2.8;

const spacing = 2;

const totalTextHeight =
    filmHeight +
    interpretHeight +
    titleHeight +
    versionHeight +
    yearHeight +
    infoHeight +
    spacing * 5;

let textY =
    position.y +
    (cardHeight - totalTextHeight) / 2;

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.setFontSize(10);

pdf.text(
    filmLines,
    centerX,
    textY,
    { align: "center" }
);

textY +=
    filmHeight + spacing;

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.setFontSize(8);

pdf.text(
    interpretLines,
    centerX,
    textY,
    { align: "center" }
);

textY +=
    interpretHeight + spacing;

pdf.text(
    titleLines,
    centerX,
    textY,
    { align: "center" }
);

textY +=
    titleHeight + spacing;

if (String(card.Version || "").trim()) {
    pdf.text(
        versionLines,
        centerX,
        textY,
        { align: "center" }
    );

    textY +=
        versionHeight + spacing;
}

pdf.setFont(
    "helvetica",
    "bold"
);

pdf.setFontSize(24);

pdf.text(
    String(card.Jahr || ""),
    centerX,
    textY + 7,
    { align: "center" }
);

textY +=
    yearHeight + spacing;

pdf.setFont(
    "helvetica",
    "normal"
);

pdf.setFontSize(7);

if (String(card.Info || "").trim()) {
    pdf.text(
        infoLines,
        centerX,
        textY,
        { align: "center" }
    );
}

pdf.setFontSize(6);

pdf.text(
    String(card.ID || ""),
    centerX,
    position.y + cardHeight - 3,
    { align: "center" }
);

        addFooter(
            currentPage,
            totalPages,
            "Rückseiten"
        );
    }

    pdf.save(
        "HH-Musikquiz-Duplex-Karten.pdf"
    );

    statusText.textContent =
        `PDF mit ${totalPages} Seiten wurde erstellt.`;
}

csvInput.addEventListener("change", () => {
    if (!csvInput.files.length) {
        return;
    }

    if (typeof Papa === "undefined") {
        statusText.textContent = "Fehler: CSV-Bibliothek fehlt.";
        return;
    }

    if (typeof QRious === "undefined") {
    statusText.textContent = "Fehler: QR-Code-Bibliothek fehlt.";
    return;
}

    const selectedFile = csvInput.files[0];
    fileName.textContent = selectedFile.name;
    statusText.textContent = "CSV wird eingelesen …";

    const reader = new FileReader();

    reader.onload = async () => {
        const result = Papa.parse(reader.result, {
            header: true,
            skipEmptyLines: true,
            transformHeader: header => header.trim()
        });

        if (result.errors.length > 0) {
            console.error(result.errors);
        }

        data = result.data;

        let missingIds = 0;
        let validationErrors = 0;

        const existingIds = new Set();

        data.forEach(row => {
            if (row.ID && row.ID.trim()) {
                const currentId = row.ID.trim();

                if (existingIds.has(currentId)) {
                    validationErrors++;
                    row.ID = createId(existingIds);
                    missingIds++;
                } else {
                    row.ID = currentId;
                    existingIds.add(currentId);
                }
            } else {
                row.ID = createId(existingIds);
                missingIds++;
            }

            if (!String(row.Film || "").trim()) {
                validationErrors++;
            }

            if (!String(row.Interpret || "").trim()) {
                validationErrors++;
            }

            if (!String(row.Titel || "").trim()) {
                validationErrors++;
            }

            if (!/^[0-9]{4}$/.test(String(row.Jahr || "").trim())) {
                validationErrors++;
            }
        });

        cardsCount.textContent = data.length;
        missingCount.textContent = missingIds;
        errorsCount.textContent =
            validationErrors + result.errors.length;

        statusText.textContent = "QR-Codes werden erzeugt …";

        await showTable(data);

        statusText.textContent = "CSV und QR-Codes erfolgreich erzeugt.";
    };

    reader.onerror = () => {
        statusText.textContent = "Fehler beim Lesen der CSV-Datei.";
    };

    reader.readAsText(selectedFile, "UTF-8");
});

if (searchInput) {
    searchInput.addEventListener("input", () => {
        const searchTerm = searchInput.value
            .trim()
            .toLowerCase();

        const rows = table.getElementsByTagName("tr");

        for (let i = 1; i < rows.length; i++) {
            const rowText = rows[i].innerText.toLowerCase();

            rows[i].style.display =
                rowText.includes(searchTerm) ? "" : "none";
        }
    });
}

downloadQrButton.addEventListener(
    "click",
    downloadAllQrCodes
);

</script>

</body></html>
