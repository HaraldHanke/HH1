<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HH Musikquiz Player</title>
  <style>
    :root{--blue:#0a84ff;--blue-dark:#0066cc;--green:#248a3d;--red:#c62828;--orange:#b35a00;--background:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#6e6e73;--border:#d1d1d6}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--background)}
    header{padding:18px 16px;color:#fff;background:var(--blue);text-align:center} header h1{margin:0;font-size:clamp(24px,6vw,34px)}
    main{width:min(720px,calc(100% - 24px));margin:18px auto 40px}.panel{margin-bottom:14px;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .panel h2{margin:0 0 12px;font-size:20px} label{display:block;margin:12px 0 5px;font-weight:700} input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:16px}
    button{width:100%;min-height:48px;margin-top:14px;padding:11px 16px;border:0;border-radius:10px;color:#fff;background:var(--blue);font-size:17px;font-weight:700;cursor:pointer} button:hover{background:var(--blue-dark)} button:disabled{cursor:not-allowed;opacity:.45}
    #status{min-height:54px;padding:12px;border-left:5px solid var(--blue);border-radius:8px;background:#eef6ff;line-height:1.45} #status.success{border-color:var(--green);background:#eef8f0} #status.error{border-color:var(--red);background:#fff0f0} #status.warning{border-color:var(--orange);background:#fff7e8}
    .result{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:10px}.result strong{display:block;margin-bottom:4px}.result-meta,.small{color:var(--muted);font-size:13px;line-height:1.45} audio{width:100%;margin-top:10px}
  </style>
</head>
<body>
  <header><h1 id="headerTitle">HH Musikquiz Player</h1></header>
  <main>
    <section class="panel">
      <h2>Deezer-Verbindung testen</h2>
      <label for="artist">Interpret</label><input id="artist" type="text" value="Celine Dion" maxlength="150">
      <label for="title">Titel</label><input id="title" type="text" value="My Heart Will Go On" maxlength="200">
      <label for="version">Version, optional</label><input id="version" type="text" value="" maxlength="150">
      <button id="searchButton" type="button">Bei Deezer suchen</button>
    </section>
    <section class="panel"><h2>Status</h2><div id="status">Bereit fÃ¼r den Deezer-Test.</div></section>
    <section class="panel"><h2>Suchergebnisse</h2><div id="results" class="small">Noch keine Suche ausgefÃ¼hrt.</div></section>
  </main>
  <script>
    "use strict";
    const PLAYER_VERSION=4,MAX_RESULTS=10,REQUEST_TIMEOUT_MS=15000;
    const headerTitle=document.getElementById("headerTitle"),artistInput=document.getElementById("artist"),titleInput=document.getElementById("title"),versionInput=document.getElementById("version"),searchButton=document.getElementById("searchButton"),statusElement=document.getElementById("status"),resultsElement=document.getElementById("results");
    headerTitle.textContent=`HH Musikquiz Player â Version ${PLAYER_VERSION}`;
    function setStatus(message,type=""){statusElement.textContent=message;statusElement.className=type}
    function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function validateInput(){const artist=artistInput.value.trim(),title=titleInput.value.trim(),version=versionInput.value.trim();if(!artist)throw new Error("Bitte einen Interpreten eingeben.");if(!title)throw new Error("Bitte einen Titel eingeben.");if(artist.length>150||title.length>200||version.length>150)throw new Error("Eine Eingabe ist zu lang.");return{artist,title,version}}
    function deezerSearchJsonp(searchText){return new Promise((resolve,reject)=>{const callbackName=`hhDeezerCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`,script=document.createElement("script"),timeout=window.setTimeout(()=>{cleanup();reject(new Error("Deezer hat innerhalb von 15 Sekunden nicht geantwortet."))},REQUEST_TIMEOUT_MS);function cleanup(){window.clearTimeout(timeout);try{delete window[callbackName]}catch{window[callbackName]=undefined}script.remove()}window[callbackName]=data=>{cleanup();if(!data||!Array.isArray(data.data)){reject(new Error("Deezer hat keine verwertbare Antwort geliefert."));return}resolve(data.data)};script.onerror=()=>{cleanup();reject(new Error("Die Deezer-Suche konnte nicht geladen werden."))};const params=new URLSearchParams({q:searchText,limit:String(MAX_RESULTS),output:"jsonp",callback:callbackName});script.src=`https://api.deezer.com/search?${params.toString()}`;script.async=true;script.referrerPolicy="no-referrer";document.head.appendChild(script)})}
    function discardAllPreviews(){document.querySelectorAll("audio").forEach(audio=>{audio.pause();audio.removeAttribute("src");audio.load()})}
    function renderResults(results){discardAllPreviews();if(results.length===0){resultsElement.innerHTML='<div class="result">Deezer hat keinen Treffer gefunden.</div>';return}resultsElement.innerHTML=results.map((result,index)=>{const artist=escapeHtml(result.artist?.name||"Unbekannter Interpret"),title=escapeHtml(result.title||"Unbekannter Titel"),album=escapeHtml(result.album?.title||"Unbekanntes Album"),preview=typeof result.preview==="string"?result.preview:"",previewPart=preview?`<audio controls playsinline preload="none" src="${escapeHtml(preview)}"></audio>`:'<div class="small">FÃ¼r diesen Treffer wurde keine HÃ¶rprobe geliefert.</div>';return`<div class="result"><strong>${index+1}. ${artist} â ${title}</strong><div class="result-meta">Album: ${album}</div>${previewPart}</div>`}).join("")}
    async function runSearch(){discardAllPreviews();resultsElement.textContent="Suche lÃ¤uft â¦";searchButton.disabled=true;try{const input=validateInput(),searchText=[input.artist,input.title,input.version].filter(Boolean).join(" ");setStatus("Deezer wird durchsucht.");const results=await deezerSearchJsonp(searchText);renderResults(results);const previews=results.filter(result=>typeof result.preview==="string"&&result.preview.length>0).length;if(results.length===0)setStatus("Deezer ist erreichbar, hat aber keinen Treffer gefunden.","warning");else if(previews===0)setStatus(`Deezer ist erreichbar. ${results.length} Treffer, aber keine HÃ¶rprobe gefunden.`,"warning");else setStatus(`Deezer funktioniert: ${results.length} Treffer, davon ${previews} mit HÃ¶rprobe.`,"success")}catch(error){resultsElement.textContent="Keine Ergebnisse verfÃ¼gbar.";setStatus(error.message||"Der Deezer-Test ist fehlgeschlagen.","error")}finally{searchButton.disabled=false}}
    searchButton.addEventListener("click",runSearch);window.addEventListener("beforeunload",discardAllPreviews);
  </script>
</body>
</html>
